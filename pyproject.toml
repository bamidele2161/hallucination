[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-hallucination-detectors"
version = "0.1.0"
description = "Training-free evaluation of medical hallucination detectors and confidence calibration"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["pyarrow>=14"]
plot = ["matplotlib>=3.8"]
hhem = ["torch==2.2.2", "transformers==4.44.2", "numpy<2", "sentencepiece==0.2.0"]
lettucedetect = ["lettucedetect==0.2.3", "torch>=2.6", "transformers>=5.5", "accelerate>=1.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
medical-hallucinations = "medical_hallucinations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
